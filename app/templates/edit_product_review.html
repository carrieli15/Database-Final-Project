{% extends "base.html" %}

{% block content %}

<div class="container mt-4">
  <h2>Edit Your Review</h2>
  
  <form method="POST" action="{{ url_for('product_reviews.edit_product_review', review_id=review.product_review_id) }}">
    <div class="form-group">
      <label for="rating">Rating (1-5)</label>
      <select class="form-control" id="rating" name="rating" required>
        <option value="">Select a rating</option>
        <option value="1" {% if review.rating == 1 %}selected{% endif %}>1 Star</option>
        <option value="2" {% if review.rating == 2 %}selected{% endif %}>2 Stars</option>
        <option value="3" {% if review.rating == 3 %}selected{% endif %}>3 Stars</option>
        <option value="4" {% if review.rating == 4 %}selected{% endif %}>4 Stars</option>
        <option value="5" {% if review.rating == 5 %}selected{% endif %}>5 Stars</option>
      </select>
    </div>
    
    <div class="form-group mt-3">
      <label for="review_text">Your Review</label>
      <textarea class="form-control" id="review_text" name="review_text" rows="5" required>{{ review.review_text }}</textarea>
    </div>
    
    <div class="mt-4">
      <button type="submit" class="btn btn-primary">Update Review</button>
      <a href="{{ url_for('product_reviews.product_reviews') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
